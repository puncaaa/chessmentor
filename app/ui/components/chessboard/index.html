<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Chessboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    body {
      margin: 0;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #board-container {
      position: relative;
      width: 420px;
      height: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    #board {
      width: 420px;
      height: 420px;
    }
    .highlight-from {
      background-color: rgba(239, 68, 68, 0.5) !important;
    }
    .highlight-to {
      background-color: rgba(239, 68, 68, 0.7) !important;
    }
    .highlight-best-from {
      background-color: rgba(16, 185, 129, 0.5) !important;
    }
    .highlight-best-to {
      background-color: rgba(16, 185, 129, 0.7) !important;
    }
    .highlight-selected {
      background-color: rgba(245, 158, 11, 0.6) !important;
    }
    .turn-indicator {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div id="board-container">
    <div id="board"></div>
  </div>
  <div id="status" class="turn-indicator">Загрузка доски...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    // Streamlit Component Protocol
    function sendMessage(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type
      }, data), "*");
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value: value });
    }

    function setFrameHeight(height) {
      sendMessage("streamlit:setFrameHeight", { height: height || document.body.offsetHeight + 10 });
    }

    let board = null;
    let game = new Chess();
    let currentFen = null;
    let currentOrientation = 'white';
    let allowMoves = true;
    let activePlayerColor = 'w';

    function clearHighlights() {
      $('#board .square-55d63').removeClass('highlight-from highlight-to highlight-best-from highlight-best-to highlight-selected');
    }

    function highlightMove(from, to, type) {
      clearHighlights();
      if (from && to) {
        if (type === 'best') {
          $('#board .square-' + from).addClass('highlight-best-from');
          $('#board .square-' + to).addClass('highlight-best-to');
        } else {
          $('#board .square-' + from).addClass('highlight-from');
          $('#board .square-' + to).addClass('highlight-to');
        }
      }
    }

    function updateStatus() {
      let statusText = '';
      let moveColor = game.turn() === 'b' ? 'Черные' : 'Белые';

      if (game.in_checkmate()) {
        statusText = 'Мат! ' + (game.turn() === 'w' ? 'Черные' : 'Белые') + ' победили.';
      } else if (game.in_draw()) {
        statusText = 'Ничья!';
      } else {
        statusText = 'Ход: ' + moveColor;
        if (game.in_check()) {
          statusText += ' (Шах!)';
        }
      }
      $('#status').text(statusText);
    }

    function onDragStart(source, piece, position, orientation) {
      if (!allowMoves || game.game_over()) return false;

      // Разрешаем ходить только фигурами стороны, чей сейчас ход
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
      return true;
    }

    function onDrop(source, target) {
      // Проверяем легальность хода через chess.js
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q' // авто-превращение в ферзя для простоты
      });

      // Нелегальный ход — возвращаем фигуру назад
      if (move === null) return 'snapback';

      updateStatus();
      highlightMove(source, target, 'user');

      // Отправляем сделанный ход в Python / Streamlit
      setComponentValue({
        event: 'move_played',
        from: source,
        to: target,
        san: move.san,
        uci: source + target + (move.promotion ? move.promotion : ''),
        fen_after: game.fen(),
        in_check: game.in_check(),
        is_game_over: game.game_over(),
        turn: game.turn(),
        timestamp: Date.now()
      });
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function initBoard(fen, orientation) {
      currentFen = fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      currentOrientation = orientation || 'white';
      game.load(currentFen);

      const config = {
        draggable: true,
        position: currentFen,
        orientation: currentOrientation,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      board = Chessboard('board', config);
      updateStatus();
      setFrameHeight(460);
    }

    // Слушатель событий от Streamlit Python
    window.addEventListener("message", function(event) {
      if (!event.data || event.data.type !== "streamlit:render") return;

      const args = event.data.args || {};
      const targetFen = args.fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      const orientation = args.orientation || 'white';
      allowMoves = args.allow_moves !== undefined ? args.allow_moves : true;

      if (!board) {
        initBoard(targetFen, orientation);
      } else {
        if (board.orientation() !== orientation) {
          board.orientation(orientation);
        }
        if (currentFen !== targetFen) {
          currentFen = targetFen;
          game.load(targetFen);
          board.position(targetFen, false);
          clearHighlights();
          updateStatus();
        }
      }

      // Подсветка стрелок/ходов из Python
      if (args.highlight_move) {
        const hm = args.highlight_move;
        highlightMove(hm.from, hm.to, hm.type || 'error');
      }

      // Анимация показа лучшего хода при клике на "Показать правильный ход"
      if (args.animate_best_move && args.best_move_uci) {
        const uci = args.best_move_uci;
        const from = uci.substring(0, 2);
        const to = uci.substring(2, 4);
        const promo = uci.length > 4 ? uci.substring(4, 5) : 'q';
        
        const bestMoveObj = game.move({ from: from, to: to, promotion: promo });
        if (bestMoveObj) {
          board.position(game.fen(), true);
          highlightMove(from, to, 'best');
          updateStatus();
          setComponentValue({
            event: 'best_move_shown',
            uci: uci,
            san: bestMoveObj.san,
            fen_after: game.fen(),
            timestamp: Date.now()
          });
        }
      }

      setFrameHeight(460);
    });

    // Уведомляем Streamlit, что компонент готов
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
